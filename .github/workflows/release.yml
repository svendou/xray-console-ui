name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package runtime
        shell: bash
        run: |
          set -eu
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/xray-console-ui"
          cp -a dist server scripts package.json README.md "$stage/xray-console-ui/"
          tar -C "$stage" -czf xray-console-ui.tar.gz xray-console-ui
          sha256sum xray-console-ui.tar.gz > xray-console-ui.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            xray-console-ui.tar.gz
            xray-console-ui.sha256
